name: Secrets scan
# Defence in depth: PRs are scanned in pr-verification; this scans every push to main and weekly (new rules catch old commits).
on:
  push: { branches: [main] }
  schedule: [{ cron: "30 3 * * 1" }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          VER=8.28.0
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_checksums.txt"
          # keep the ORIGINAL file names: the checksum file refers to them
          grep " gitleaks_${VER}_linux_x64.tar.gz$" "gitleaks_${VER}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${VER}_linux_x64.tar.gz" gitleaks && sudo mv gitleaks /usr/local/bin/
      - run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
