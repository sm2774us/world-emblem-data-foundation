name: Release

# merge to main -> `plan` computes the next SemVer from Conventional Commits -> `publish` WAITS for a reviewer to approve the
# `release` environment -> on approval: quality gate, version + changelog, tag, GitHub Release, GHCR image with provenance.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_VERSION: "0.12.21"
  PYTHON_VERSION: "3.14"

jobs:
  plan:
    name: plan (compute version and notes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - id: plan
        run: python tools/release.py plan

  publish:
    name: publish (approval required)
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release   # required reviewers configured on this environment = the manual approval gate
    permissions:
      contents: write       # push release commit + tag, create the GitHub Release
      packages: write       # push image to GHCR
      id-token: write       # keyless signing (Sigstore)
      attestations: write   # store provenance
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}   # optional PAT if the ruleset cannot list Actions as a bypass actor
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with: { version: "${{ env.UV_VERSION }}", python-version: "${{ env.PYTHON_VERSION }}", enable-cache: true }
      - run: uv sync --locked
      - name: Quality gate on the exact commit being released
        run: |
          uv run ruff check src tests dags tools
          uv run pytest -m "not spark and not airflow" --cov
      - name: Apply version, changelog and release notes
        run: |
          python tools/release.py apply
          uv lock --check   # the release commit must keep uv.lock consistent, or the --locked image build fails
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock CHANGELOG.md
          if git diff --cached --quiet; then echo "No version change; tagging the current commit"; else git commit -m "chore(release): v${VERSION} [skip ci]"; fi
          git tag -a "v${VERSION}" -m "v${VERSION}"
      - name: Push release commit and tag
        run: git push origin HEAD:main --follow-tags
      - id: repo
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: img
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.lower }}:${{ env.VERSION }}
            ghcr.io/${{ steps.repo.outputs.lower }}:latest
          cache-from: type=gha
      - name: Attest image provenance
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-name: ghcr.io/${{ steps.repo.outputs.lower }}
          subject-digest: ${{ steps.img.outputs.digest }}
          push-to-registry: true
      - name: Create GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "v${VERSION}" --title "v${VERSION}" --notes-file RELEASE_NOTES.md --verify-tag
