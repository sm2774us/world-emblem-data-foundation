[project]
name = "world-emblem-data-foundation"
version = "1.1.1"
description = "Governed enterprise data foundation showcase: audit, architecture, pipelines, quality, governance, AI enablement and a 90-day plan."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
  "duckdb>=1.5",
  "pydantic>=2.12",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "cryptography>=45",
]

[project.scripts]
emblem = "emblem.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "mypy>=1.17",
  "types-pyyaml",
]
spark = ["pyspark>=4.0"]
airflow = ["apache-airflow>=3.1"]
dbt = ["dbt-duckdb>=1.10"]

[tool.uv]
default-groups = ["dev"]
conflicts = [[{ group = "airflow" }, { group = "dbt" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emblem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: multi-component tests (DuckDB, API, Spark, Airflow)",
  "e2e: black-box tests against a real running HTTP server",
  "spark: needs Java and the spark dependency group",
  "airflow: needs the airflow dependency group",
]

[tool.coverage.run]
source = ["src/emblem"]
omit = ["src/emblem/spark_jobs/*", "src/emblem/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests", "dags"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "RUF"]
ignore = ["S101", "S608", "RUF012", "E501", "UP031", "UP047", "SIM105", "SIM115", "RUF005"]

[tool.ruff.lint.per-file-ignores]
"src/emblem/sources/synthetic.py" = ["S311"]
"tests/**" = ["S105", "S106", "S108", "S603", "S607"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
disable_error_code = ["no-untyped-call", "no-any-return", "unused-ignore"]

[[tool.mypy.overrides]]
module = "emblem.sources.synthetic"
ignore_errors = true  # synthetic data generator: heterogeneous row dicts by design

[[tool.mypy.overrides]]
module = ["pyspark.*"]
ignore_missing_imports = true
