# Data contracts: the single source of truth for bronze->silver typing, schema-drift handling,
# classification, freshness SLAs and retention. Staging SQL is GENERATED from this file.
version: 1
datasets:
  - id: bc.customers
    source: business_central
    owner: Finance
    pk: "no"
    updated_at: modified_at
    freshness_hours: 30
    retention_days: 2555
    columns:
      "no": {type: VARCHAR, required: true}
      name: {type: VARCHAR, required: true}
      email: {type: VARCHAR, class: pii}
      phone: {type: VARCHAR, class: pii}
      city: {type: VARCHAR}
      state: {type: VARCHAR}
      country: {type: VARCHAR}
      currency: {type: VARCHAR}
      credit_limit: {type: DOUBLE, class: confidential}
      tax_id: {type: VARCHAR, class: restricted}
      modified_at: {type: TIMESTAMP, required: true}
  - id: bc.items
