rubric:   # weights sum to 100; each item scored 0 (absent) 1 (partial) 2 (meets)
  documentation:   {weight: 25, items: [architecture_diagram, field_mapping, runbook, error_catalogue]}
  security:        {weight: 30, items: [secrets_in_vault, least_privilege_scopes, encryption_in_transit, audit_logging, pii_minimisation]}
  maintainability: {weight: 25, items: [source_control_access, automated_tests, config_as_code, schema_change_handling]}
  delivery_quality: {weight: 20, items: [retries_dead_letter, idempotency, monitoring_alerts, sla_and_support, handover_training]}
blocking: [secrets_in_vault, idempotency]   # a 0 on any of these blocks acceptance regardless of total score
